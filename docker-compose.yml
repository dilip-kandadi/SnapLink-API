version: '3.8'

services:
  # Service 1: Your App
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - mysqldb
      - redisdb
    environment:
      # CRITICAL: We tell the app to look for 'mysqldb' and 'redisdb', not 'localhost'
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/snaplink
      - SPRING_DATA_REDIS_HOST=redisdb
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

  # Service 2: MySQL Database
  mysqldb:
    image: mysql:8.0
    ports:
      - "3307:3306" # We use port 3307 on your laptop to avoid conflict with your installed MySQL
    environment:
      - MYSQL_DATABASE=snaplink
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - mysql-data:/var/lib/mysql

  # Service 3: Redis Cache
  redisdb:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  mysql-data: