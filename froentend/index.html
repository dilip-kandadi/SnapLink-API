<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapLink</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <input type="url" placeholder="Enter URL" id="url">
        <button id="short">Short</button> 
    </div>
    <p id="result"></p>
    <div class="box">
        <input type="text" placeholder="Enter Short URL" id="shortcode">
        <button id="statsBtn">Get Stats</button>
    </div>
    <div class="box">
        <p id="statsResult"></p>
    </div>
   <div class="bucket">
        <ul id="urlstats">
           
        </ul>
    </div>
     <script src="script.js"></script>
</body>
</html>
